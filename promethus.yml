global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "gateway"
    static_configs:
      - targets: ["localhost:4000"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["localhost:3001"]

  - job_name: "teacher-service"
    static_configs:
      - targets: ["localhost:3003"]

  - job_name: "student-service"
    static_configs:
      - targets: ["localhost:3002"]